[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "databridge-validator"
version = "0.1.0"
description = "Generic, reusable utilities for validating data migration from legacy systems to modern cloud platforms."
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
authors = [
    { name = "databridge-validator contributors" },
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Testing",
]
dependencies = [
    "pandas>=1.5.0",
]

[project.optional-dependencies]
spark = ["pyspark>=3.3.0"]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "ruff>=0.4",
    "build>=1.0",
    "twine>=5.0",
    "mypy>=1.0",
]
all = [
    "databridge-validator[spark,dev]",
]

[project.urls]
Homepage = "https://github.com/databridge-validator/databridge-validator"
Issues = "https://github.com/databridge-validator/databridge-validator/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/databridge_validator"]

[tool.ruff]
line-length = 120
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM", "RUF"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "spark: marks tests requiring PySpark",
]

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true

[tool.coverage.run]
source = ["databridge_validator"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if _is_spark_dataframe",
    "def _.*_spark",
    "def _compare_spark",
    "def _get_spark_imports",
    "_get_spark_imports\\(",
    "from pyspark",
    "import pyspark",
]

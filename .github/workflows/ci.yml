name: CI — Test & Lint

on:
  pull_request:
    branches: [main]
  workflow_call:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint with ruff
        run: |
          ruff check src/ tests/
          ruff format --check src/ tests/

      - name: Run unit tests with coverage
        run: |
          pytest tests/unit/ --cov=databridge_validator --cov-report=xml --cov-fail-under=80 -v

  test-spark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies with Spark
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,spark]"

      - name: Run all tests including Spark integration
        run: |
          pytest --cov=databridge_validator --cov-report=xml --cov-fail-under=80 -v